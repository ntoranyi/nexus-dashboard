<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>NEXUS AI — Reel 02 (sous-titres)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Sous-titres générés par tools/cues.py à partir de captions/reel-02.txt -->
    <script src="captions/reel-02.js"></script>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("assets/fonts/archivo-black-400.woff2") format("woff2");
        font-weight: 400;
      }
      :root {
        --black: #0b0b0b;
        --orange: #ff5a00;
        --paper: #f2ede4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #footage {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Sous-titres : gros, capitales, mot actif surligné orange.
         Zone : bas du sujet (≈ y 1330-1560), hors des 250 px réservés à l'UI en haut et en bas. */
      #captions {
        pointer-events: none;
      }
      .cue {
        position: absolute;
        left: 60px;
        top: 1330px;
        width: 960px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 10px 18px;
        height: 230px;
        opacity: 0;
      }
      .word {
        display: block;
        padding: 6px 14px 10px;
        font-family: "Archivo Black", sans-serif;
        font-size: 84px;
        line-height: 1;
        text-transform: uppercase;
        color: var(--paper);
        background-color: rgba(255, 90, 0, 0);
        -webkit-text-stroke: 3px var(--black);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 var(--black);
      }

      /* CTA final : bandeau orange façon tampon, dans la zone floue du haut (y 270-390),
         sous les 250 px réservés à l'UI et au-dessus de la vidéo (qui commence à y 420). */
      #cta-tag {
        position: absolute;
        top: 270px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
      }
      #cta-text {
        display: block;
        padding: 18px 40px 22px;
        background: var(--orange);
        color: var(--black);
        font-family: "Archivo Black", sans-serif;
        font-size: 64px;
        line-height: 1;
        border: 6px solid var(--black);
        box-shadow: 10px 10px 0 var(--black);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel-02"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        src="assets/footage/reel-02-vertical-1080x1920.mp4"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio
        id="voice"
        src="assets/footage/reel-02-vertical-1080x1920.mp4"
        data-start="0"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <!-- Fond musical original (tools/bgm_synth.py), normalisé à -30 LUFS, soit ~16 dB sous la voix -->
      <audio
        id="bgm"
        src="assets/audio/bgm-reel-02.wav"
        data-start="0"
        data-duration="8"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <!-- Effets sonores discrets (whoosh Pixabay, -11 dB) juste avant chaque changement de phrase -->
      <audio id="sfx-1" src="assets/audio/sfx-whoosh-soft.wav" data-start="2.5" data-duration="0.57" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-2" src="assets/audio/sfx-whoosh-soft.wav" data-start="4.8" data-duration="0.57" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-3" src="assets/audio/sfx-whoosh-soft.wav" data-start="5.93" data-duration="0.57" data-track-index="12" data-volume="1"></audio>
      <!-- CTA final (2 dernières secondes) -->
      <div id="cta" class="clip" data-start="6" data-duration="2" data-track-index="2">
        <div id="cta-tag"><span id="cta-text">Link in bio</span></div>
      </div>
      <div id="captions" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const host = document.getElementById("captions");

      window.CAPTIONS.forEach((cue, i) => {
        const el = document.createElement("div");
        el.className = "cue";
        el.id = "cue-" + i;
        cue.words.forEach((w, j) => {
          const span = document.createElement("span");
          span.className = "word";
          span.id = "cue-" + i + "-w" + j;
          span.textContent = w.w;
          el.appendChild(span);
        });
        host.appendChild(el);

        // Entrée du carton : claque (scale), sortie sèche à la fin
        tl.fromTo(el, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.out" }, cue.start);
        tl.to(el, { opacity: 0, duration: 0.04, ease: "none" }, Math.max(cue.end - 0.04, cue.start + 0.12));

        // Mot actif : fond orange + texte noir, puis retour
        cue.words.forEach((w, j) => {
          const span = "#cue-" + i + "-w" + j;
          tl.to(span, { backgroundColor: "rgba(255, 90, 0, 1)", color: "#0b0b0b", duration: 0.05, ease: "none" }, w.s);
          tl.to(span, { backgroundColor: "rgba(255, 90, 0, 0)", color: "#f2ede4", duration: 0.05, ease: "none" }, Math.max(w.e - 0.05, w.s + 0.05));
        });
      });

      // CTA : claque comme un tampon (zoom + légère rotation), puis reste fixe
      tl.fromTo("#cta-text", { opacity: 0, scale: 1.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.22, ease: "power4.in" }, 6.0);
      tl.fromTo("#cta-tag", { y: 0 }, { y: 6, duration: 0.05, repeat: 3, yoyo: true, ease: "none", immediateRender: false }, 6.22);

      window.__timelines["reel-02"] = tl;
    </script>
  </body>
</html>
