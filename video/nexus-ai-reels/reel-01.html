<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>NEXUS AI — Reel 01 (sous-titres)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Sous-titres générés par tools/cues.py à partir de captions/reel-01.txt -->
    <script src="captions/reel-01.js"></script>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("assets/fonts/archivo-black-400.woff2") format("woff2");
        font-weight: 400;
      }
      :root {
        --black: #0b0b0b;
        --orange: #ff5a00;
        --paper: #f2ede4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #footage {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Sous-titres : gros, capitales, mot actif surligné orange.
         Zone : bas du sujet (≈ y 1330-1560), hors des 250 px réservés à l'UI en haut et en bas. */
      #captions {
        pointer-events: none;
      }
      .cue {
        position: absolute;
        left: 60px;
        top: 1330px;
        width: 960px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 10px 18px;
        height: 230px;
        opacity: 0;
      }
      .word {
        display: block;
        padding: 6px 14px 10px;
        font-family: "Archivo Black", sans-serif;
        font-size: 84px;
        line-height: 1;
        text-transform: uppercase;
        color: var(--paper);
        background-color: rgba(255, 90, 0, 0);
        -webkit-text-stroke: 3px var(--black);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 var(--black);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel-01"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        src="assets/footage/brut-vertical-1080x1920.mp4"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio
        id="voice"
        src="assets/footage/brut-vertical-1080x1920.mp4"
        data-start="0"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <div id="captions" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const host = document.getElementById("captions");

      window.CAPTIONS.forEach((cue, i) => {
        const el = document.createElement("div");
        el.className = "cue";
        el.id = "cue-" + i;
        cue.words.forEach((w, j) => {
          const span = document.createElement("span");
          span.className = "word";
          span.id = "cue-" + i + "-w" + j;
          span.textContent = w.w;
          el.appendChild(span);
        });
        host.appendChild(el);

        // Entrée du carton : claque (scale), sortie sèche à la fin
        tl.fromTo(el, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.out" }, cue.start);
        tl.to(el, { opacity: 0, duration: 0.04, ease: "none" }, Math.max(cue.end - 0.04, cue.start + 0.12));

        // Mot actif : fond orange + texte noir, puis retour
        cue.words.forEach((w, j) => {
          const span = "#cue-" + i + "-w" + j;
          tl.to(span, { backgroundColor: "rgba(255, 90, 0, 1)", color: "#0b0b0b", duration: 0.05, ease: "none" }, w.s);
          tl.to(span, { backgroundColor: "rgba(255, 90, 0, 0)", color: "#f2ede4", duration: 0.05, ease: "none" }, Math.max(w.e - 0.05, w.s + 0.05));
        });
      });

      window.__timelines["reel-01"] = tl;
    </script>
  </body>
</html>
