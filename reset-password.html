<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — NEXUS AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #020610;
      font-family: 'Arial', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(26,58,92,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,58,92,0.15) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(26,58,92,0.4) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(10, 20, 40, 0.9);
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 24px;
      padding: 56px 48px;
      width: 100%; max-width: 480px;
      backdrop-filter: blur(10px);
    }
    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .logo span { color: #4FC3F7; }
    .subtitle {
      text-align: center;
      color: rgba(232,240,250,0.5);
      font-size: 15px;
      margin-bottom: 40px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      color: rgba(232,240,250,0.7);
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      background: rgba(26,58,92,0.3);
      border: 1px solid rgba(79,195,247,0.2);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    .field input:focus { border-color: #4FC3F7; }
    .field.has-error input { border-color: #EF4444; }
    .btn {
      width: 100%;
      background: #1A3A5C;
      border: 2px solid #4FC3F7;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .btn:hover { background: #4FC3F7; color: #020610; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #EF4444;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .success-card {
      text-align: center;
      display: none;
    }
    .success-card.show { display: block; }
    .success-icon {
      width: 80px; height: 80px;
      background: rgba(16,185,129,0.1);
      border: 2px solid #10B981;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    .success-title {
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .success-sub {
      color: rgba(232,240,250,0.6);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn-dashboard {
      display: inline-block;
      background: #4FC3F7;
      color: #020610;
      border-radius: 12px;
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="card">
    <div class="logo">NEXUS<span>AI</span></div>
    <div class="subtitle">Choisis un nouveau mot de passe</div>

    <div id="formWrap" style="display:none">
      <div class="error-msg" id="errorMsg"></div>
      <div class="field" id="fieldPwd">
        <label>Nouveau mot de passe</label>
        <input type="password" id="pwd" placeholder="8 caractères minimum">
      </div>
      <div class="field" id="fieldPwd2">
        <label>Confirme le mot de passe</label>
        <input type="password" id="pwd2" placeholder="8 caractères minimum">
      </div>
      <button class="btn" id="submitBtn" onclick="handleUpdatePassword()">Mettre à jour le mot de passe →</button>
    </div>

    <div class="success-card" id="invalidLinkCard">
      <div class="success-icon" style="background:rgba(239,68,68,0.1);border-color:#EF4444">⚠</div>
      <div class="success-title">Lien invalide ou expiré</div>
      <div class="success-sub">Ce lien de réinitialisation n'est plus valide. Demande-en un nouveau depuis la page de connexion.</div>
      <a href="/login.html" class="btn-dashboard">Retour à la connexion →</a>
    </div>

    <div class="success-card" id="successCard">
      <div class="success-icon">✓</div>
      <div class="success-title">Mot de passe mis à jour !</div>
      <div class="success-sub">Tu peux maintenant accéder à ton dashboard.</div>
      <a href="/dashboard.html" class="btn-dashboard">Accéder au dashboard →</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pgwwgwchlhmemkitrcxh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gPqMnHI4GWUhrVitkZIUwQ_WwRZCgly';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Le lien envoyé par Supabase (resetPasswordForEmail) établit une session de
    // récupération temporaire côté client dès le chargement de la page (détection
    // automatique du token dans l'URL par supabase-js). On vérifie ensuite qu'une
    // session existe avant d'afficher le formulaire.
    sbClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        document.getElementById('formWrap').style.display = 'block';
      }
    });

    (async () => {
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) {
        document.getElementById('formWrap').style.display = 'block';
      } else {
        setTimeout(async () => {
          const { data: { session: retrySession } } = await sbClient.auth.getSession();
          if (retrySession) {
            document.getElementById('formWrap').style.display = 'block';
          } else {
            document.getElementById('invalidLinkCard').classList.add('show');
          }
        }, 1500);
      }
    })();

    async function handleUpdatePassword() {
      const pwd = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      errorMsg.style.display = 'none';

      if (!pwd || pwd.length < 8) {
        errorMsg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
        errorMsg.style.display = 'block';
        return;
      }
      if (pwd !== pwd2) {
        errorMsg.textContent = 'Les deux mots de passe ne correspondent pas.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Mise à jour en cours...';

      const { error } = await sbClient.auth.updateUser({ password: pwd });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Mettre à jour le mot de passe →';
        errorMsg.textContent = 'Erreur : ' + (error.message || 'Une erreur est survenue. Réessaye.');
        errorMsg.style.display = 'block';
        return;
      }

      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('successCard').classList.add('show');
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && document.getElementById('formWrap').style.display !== 'none') handleUpdatePassword();
    });
  </script>
</body>
</html>
